services:
  donna-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: donna-os
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    env_file:
      - .env
    volumes:
      - donna-data:/app/.donna
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/models/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  donna-data:
    driver: local
